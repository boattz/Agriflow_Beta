services:
  - type: web
    name: agriflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESET_TOKEN
        sync: false
      - key: LINE_ENABLED
        value: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_REG_CODE
        sync: false
      - key: LINE_OFFLINE_MIN
        value: 1
      - key: LINE_COOLDOWN_MIN
        value: 60
      - key: LINE_MIN_INTERVAL_MIN
        value: 3
      - key: SENSOR_API_KEY
        sync: false
      - key: RETENTION_DAYS
        value: 30
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: 4000
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        value: smart_sprinkler
